server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /proxy/azure/ {
        proxy_pass https://bp-dev-apim.azure-api.net/;
        proxy_set_header Host bp-dev-apim.azure-api.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /proxy/suw-dev/ {
        proxy_pass https://suw-dev-backend-service-as.azurewebsites.net/;
        proxy_set_header Host suw-dev-backend-service-as.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    types {
        application/javascript js mjs;
        text/css css;
        text/html html;
        application/json json;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
        image/svg+xml svg;
        application/wasm wasm;
    }

    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|woff2?|eot|ttf|svg|wasm|json|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}